# OpenSpec — plugin tpvmod
# Initialized: 2026-06-20

project: tpvmod-plugin
scope: plugins/tpvmod/
parent_project: fs-framework
parent_openspec: ../../openspec/   # referencia, NO tracker — no crear cambios aquí
artifact_store: openspec

# =============================================================================
# OpenSpec per plugin — esta es la ÚNICA ubicación de SDD para el plugin.
# =============================================================================
# Regla arquitectónica del proyecto (ver AGENTS.md → "OpenSpec per plugin"):
#
#   - Plugin openspec (este archivo): fuente de verdad para TODO SDD del plugin
#     (proposal, specs, tasks, verify-report, archive-report).
#
#   - Core openspec (../../openspec/): SOLO para cambios que tocan código del
#     core (base/, src/, controller/, model/ raíz, o convenciones que cruzan
#     múltiples plugins). NO usar para cambios internos a tpvmod.
#
#   - NO crear entradas en el core openspec para cambios 100% internos al
#     plugin. El plugin vive en su propio ciclo de vida (gitignored del core,
#     con su propio .git).
#
#   - Criterio rápido: si el change NO toca archivos fuera de plugins/tpvmod/,
#     todo el SDD vive aquí. Si toca algo del core (poco probable para tpvmod
#     porque depende de facturacion_base para los modelos caja/terminal_caja),
#     abrir el SDD en el core y referenciar al plugin.
# =============================================================================

ownership: plugin-local
change_root: plugins/tpvmod/openspec/changes/{name}/
archive_root: plugins/tpvmod/openspec/changes/archive/{YYYY-MM-DD}-{name}/

context: >
  Plugin TPV (Terminal Punto de Venta) para FSFramework. Vistas Twig 3
  nativas (los .html.twig viven en plugins/tpvmod/view/, sin RainTPL
  residual). Controladores legacy en plugins/tpvmod/controller/ sin
  namespace PSR-4 (refactor PSR-4 diferido a un SDD posterior). Plugin
  Composer configurado: composer.json, composer.lock, Init.php
  (namespace FSFramework\Plugins\tpvmod) y vendor/ versionado.
  Depende de clientes_facturacion, catalogo_core, business_data y
  clientes_core. facturacion_base es opcional: cuando está activo
  habilita caja, terminal_caja, tpv_caja, tpv_recambios y
  ventas_imprimir; cuando no, el TPV opera en modo ventas directas
  sin apertura de caja.

strict_tdd: true

testing:
  runner: ddev exec php vendor/bin/phpunit
  plugin_tests: true
  plugin_phpunit: plugins/tpvmod/phpunit.xml
  linter: ddev exec composer phpstan
  smoke: >
    Flujo manual: abrir tpvmod como agente con permisos, elegir "no terminal"
    o "continuar sin terminal", generar tickets, cerrar caja, reimprimir.

phase_rules:
  proposal: require intent, scope, and approach before spec/design
  spec: use delta specs under changes/<name>/specs/
  tasks: break into implementation units with dependencies
  apply: implement tasks; smoke test the controller flow after each task
  verify: smoke checklist + grep audit + phpstan (nivel proyecto)
  archive: >
    Sync delta into openspec/specs/ (the plugin's specs/) and move the
    change dir to changes/archive/YYYY-MM-DD-<name>/. The plugin's own
    archive/, NOT the parent core's archive/. See AGENTS.md
    "OpenSpec per plugin" for the full convention.
